<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .toast{animation:toast 3s ease-in-out infinite}
    @keyframes toast{0%,40%{opacity:0;transform:translateY(6px)}50%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    .dim{animation:dim 3s ease-in-out infinite}
    @keyframes dim{0%,100%{opacity:.35}50%{opacity:.6}}
  </style>
  <rect x="0.5" y="0.5" width="479" height="219" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="5" height="219" rx="2" fill="#f97316"/>

  <text x="26" y="50" font-size="26" font-weight="700" fill="#f0f6fc">UrbanReport</text>
  <text x="26" y="74" font-size="13" fill="#8b949e">Proyecto de título 🎓</text>
  <text x="26" y="104" font-size="13" fill="#c9d1d9">Reporta incidencias urbanas</text>
  <text x="26" y="124" font-size="13" fill="#c9d1d9">desde el celular, de forma</text>
  <text x="26" y="144" font-size="13" fill="#c9d1d9">anónima y en segundos</text>
  <g font-size="11" font-weight="600">
    <rect x="26" y="170" width="86" height="22" rx="11" fill="#3178c6" fill-opacity=".18" stroke="#3178c6"/>
    <text x="69" y="185" text-anchor="middle" fill="#8ab8ee">TypeScript</text>
    <rect x="120" y="170" width="44" height="22" rx="11" fill="#f97316" fill-opacity=".14" stroke="#f97316"/>
    <text x="142" y="185" text-anchor="middle" fill="#fdba74">Web</text>
  </g>

  <!-- teléfono -->
  <rect x="330" y="18" width="100" height="186" rx="16" fill="#1f2430" stroke="#4b5263" stroke-width="2"/>
  <rect x="338" y="32" width="84" height="158" rx="6" fill="#16202c"/>
  <rect x="365" y="23" width="30" height="4" rx="2" fill="#4b5263"/>
  <!-- mapa -->
  <g stroke="#2c3a4d" stroke-width="5" fill="none">
    <path d="M338 70 H422 M338 130 H422 M360 32 V190 M402 32 V190"/>
    <path d="M338 175 L422 95" stroke-width="3"/>
  </g>
  <rect x="368" y="80" width="26" height="40" rx="3" fill="#1e3a2b"/>
  <g class="dim" fill="#f97316">
    <circle cx="350" cy="150" r="3"/><circle cx="412" cy="58" r="3"/><circle cx="413" cy="165" r="3"/>
  </g>

  <!-- ping -->
  <circle cx="380" cy="125" r="0" fill="none" stroke="#f97316" stroke-width="2">
    <animate attributeName="r" values="0;0;26;26" keyTimes="0;0.3;0.75;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.3;0.75;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- pin -->
  <g transform="translate(380,125)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-80;0,0;0,-10;0,0;0,0" keyTimes="0;0.22;0.3;0.36;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.1;0.36;0.9;1" dur="3s" repeatCount="indefinite"/>
      <path d="M0 0 C-4 -8 -11 -13 -11 -21 A11 11 0 1 1 11 -21 C11 -13 4 -8 0 0 Z" fill="#f97316"/>
      <circle cx="0" cy="-21" r="4.5" fill="#fff"/>
    </g>
  </g>
  <!-- notificación -->
  <g class="toast">
    <rect x="344" y="160" width="72" height="22" rx="11" fill="#22c55e"/>
    <text x="380" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#06240f">✓ Reportado</text>
  </g>
</svg>
